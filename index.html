<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Diseñador Isométrico & Analizador con IA de Plomería</title>
  <style>
    * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { background: #121214; color: #e1e1e6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    
    /* Toolbar Principal */
    #toolbar { display: flex; gap: 6px; padding: 8px; background: #1e1e24; border-bottom: 1px solid #323238; overflow-x: auto; align-items: center; z-index: 10; scrollbar-width: none; }
    #toolbar::-webkit-scrollbar { display: none; }
    
    button, select, label.btn-label { background: #29292e; color: #e1e1e6; border: 1px solid #323238; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 5px; outline: none; cursor: pointer; }
    button:active, select:active, label.btn-label:active { background: #323238; }
    button.active { background: #00875f; border-color: #00b37e; color: #fff; }
    button.ai-btn { background: #8257e5; border-color: #996dff; color: #fff; }

    /* Contenedor del Lienzo */
    #canvas-container { flex: 1; position: relative; width: 100%; height: 100%; background: #09090a; }
    canvas { width: 100%; height: 100%; display: block; }

    /* Modales */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
    .modal-content { background: #1e1e24; border: 1px solid #323238; border-radius: 12px; padding: 20px; width: 90%; max-width: 450px; display: flex; flex-direction: column; gap: 12px; max-height: 85vh; overflow-y: auto; }
    .modal-content h3 { color: #fff; text-align: center; font-size: 18px; }
    .modal-btn { padding: 12px; border-radius: 8px; background: #29292e; border: 1px solid #323238; color: #fff; text-align: center; font-size: 14px; font-weight: 600; cursor: pointer; }
    .modal-btn.primary { background: #00875f; border-color: #00b37e; }
    .modal-btn.purple { background: #8257e5; border-color: #996dff; }
    .modal-btn.danger { background: #aa2424; border-color: #f75a68; }

    /* Estilos de Controles de Capa de Fondo */
    .bg-controls { display: flex; align-items: center; gap: 8px; background: #121214; padding: 8px; border-radius: 6px; font-size: 12px; }
    .bg-controls input[type=range] { flex: 1; }

    /* Tabla de Materiales */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { border: 1px solid #323238; padding: 8px; text-align: left; }
    th { background: #29292e; color: #00b37e; }

    /* AI Analysis Result Text Format */
    .ai-result-box { background: #121214; border: 1px solid #323238; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; color: #e1e1e6; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>

  <!-- Barra de Herramientas Principal -->
  <div id="toolbar">
    <button onclick="openModal('menu-modal')">📋 Menú</button>
    
    <!-- Carga de Imagen de Fondo para Calcado -->
    <label class="btn-label" for="bg-upload">🖼️ Cargar Plano
      <input type="file" id="bg-upload" accept="image/*" style="display:none" onchange="loadBackgroundImage(event)">
    </label>

    <!-- Botón IA -->
    <button class="ai-btn" onclick="analyzeImageWithAI()">🤖 Analizar con IA</button>

    <button id="btn-move" class="active" onclick="setMode('move')">✋ Mover</button>
    <button id="btn-node" onclick="setMode('node')">📍 Nodo</button>
    <button id="btn-pipe" onclick="setMode('pipe')">🔗 Tubo</button>
    
    <!-- Selección de Tipo de Sistema -->
    <select id="sys-type" onchange="draw()">
      <option value="af">🔵 Agua Fría</option>
      <option value="ac">🔴 Agua Caliente</option>
      <option value="as">🟠 Drenaje / Servidas</option>
      <option value="gas">🟡 Ventilación / Gas</option>
    </select>

    <!-- Diámetros -->
    <select id="pipe-dia">
      <option value="1/2">½"</option>
      <option value="3/4">¾"</option>
      <option value="1">1"</option>
      <option value="1.5">1 ½"</option>
      <option value="2">2"</option>
      <option value="4">4"</option>
    </select>

    <!-- Accesorios -->
    <select id="fitting-type">
      <option value="none">📍 Nodo Simple</option>
      <option value="codo">↩️ Codo 90°</option>
      <option value="tee">🔀 Tee</option>
      <option value="valvula">🚰 Válvula de Paso</option>
      <option value="bomba">⚙️ Bomba de Agua</option>
      <option value="punto">🚿 Punto de Agua</option>
    </select>

    <button id="btn-level" onclick="toggleLevel()">🏢 Planta Baja</button>
    <button onclick="undo()">↩️ Deshacer</button>
  </div>

  <div id="canvas-container">
    <canvas id="isoCanvas"></canvas>
  </div>

  <!-- Modal Menú Principal -->
  <div id="menu-modal" class="modal" onclick="closeModal('menu-modal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>Opciones del Proyecto</h3>

      <div class="bg-controls" id="bg-tools" style="display:none;">
        <span>Transparencia Plano:</span>
        <input type="range" id="bg-opacity" min="0.1" max="1" step="0.1" value="0.5" oninput="draw()">
        <button onclick="clearBgImage()" style="padding:4px 8px; font-size:11px;">Quitar Plano</button>
      </div>

      <button class="modal-btn primary" onclick="generateMaterials()">📊 Cómputo de Materiales</button>
      <button class="modal-btn purple" onclick="configureApiKey()">🔑 Configurar Clave API Gemini</button>
      <button class="modal-btn" onclick="exportImage()">📸 Exportar Imagen (PNG)</button>
      <button class="modal-btn" onclick="saveData()">💾 Guardar Proyecto</button>
      <button class="modal-btn danger" onclick="clearAll()">🗑️ Borrar Todo</button>
      <button class="modal-btn" onclick="closeModal('menu-modal')">❌ Cerrar</button>
    </div>
  </div>

  <!-- Modal Cómputo de Materiales -->
  <div id="materials-modal" class="modal" onclick="closeModal('materials-modal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>Lista de Materiales Trazados</h3>
      <div id="materials-list"></div>
      <button class="modal-btn" onclick="closeModal('materials-modal')">Cerrar</button>
    </div>
  </div>

  <!-- Modal Resultados IA -->
  <div id="ai-modal" class="modal" onclick="closeModal('ai-modal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>🤖 Análisis e Isograma IA</h3>
      <div id="ai-loading" style="display:none; text-align:center; padding:20px;">
        <p>🔍 Analizando plano/boceto con visión artificial...</p>
        <p style="font-size:12px; color:#888; margin-top:8px;">Detectando tuberías, puntos de agua, metros lineales y accesorios.</p>
      </div>
      <div id="ai-results" class="ai-result-box" style="display:none;"></div>
      <button class="modal-btn" onclick="closeModal('ai-modal')">Cerrar</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('isoCanvas');
    const ctx = canvas.getContext('2d');

    // Estado de la Aplicación
    let mode = 'move';
    let currentLevel = 'Planta Baja';
    let panX = 0, panY = 0;
    let isDragging = false;
    let startX = 0, startY = 0;

    let nodes = [];
    let pipes = [];
    let history = [];
    let selectedNode = null;

    // Fondo / Plano
    let bgImage = null;
    let bgBase64 = null;
    let bgMimeType = 'image/jpeg';

    const isoAngle = Math.PI / 6; // 30 grados
    const gridSize = 35;

    const sysColors = {
      af: '#00a8ff',
      ac: '#ff4757',
      as: '#ffa502',
      gas: '#eccc68'
    };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = canvas.parentElement.clientHeight;
      draw();
    }
    window.addEventListener('resize', resizeCanvas);

    function saveState() {
      history.push(JSON.stringify({ nodes, pipes }));
      if (history.length > 20) history.shift();
    }

    function undo() {
      if (history.length > 0) {
        const last = JSON.parse(history.pop());
        nodes = last.nodes;
        pipes = last.pipes;
        selectedNode = null;
        draw();
      }
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function setMode(newMode) {
      mode = newMode;
      document.querySelectorAll('#toolbar button').forEach(b => {
        if (['btn-move', 'btn-node', 'btn-pipe'].includes(b.id)) b.classList.remove('active');
      });
      document.getElementById('btn-' + newMode).classList.add('active');
      selectedNode = null;
      draw();
    }

    function toggleLevel() {
      currentLevel = currentLevel === 'Planta Baja' ? 'Planta Alta' : 'Planta Baja';
      document.getElementById('btn-level').innerText = '🏢 ' + currentLevel;
      draw();
    }

    // Cargar Plano de Fondo para Calcado
    function loadBackgroundImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      bgMimeType = file.type || 'image/jpeg';
      const reader = new FileReader();
      reader.onload = function(event) {
        bgBase64 = event.target.result;
        const img = new Image();
        img.onload = function() {
          bgImage = img;
          document.getElementById('bg-tools').style.display = 'flex';
          draw();
        };
        img.src = bgBase64;
      };
      reader.readAsDataURL(file);
    }

    function clearBgImage() {
      bgImage = null;
      bgBase64 = null;
      document.getElementById('bg-tools').style.display = 'none';
      draw();
    }

    // Grid e Isometría
    function getIsoGridPoint(screenX, screenY) {
      const relX = screenX - (canvas.width / 2) - panX;
      const relY = screenY - (canvas.height / 3) - panY;

      const isoX = (relX / Math.cos(isoAngle) + relY / Math.sin(isoAngle)) / 2;
      const isoY = (relY / Math.sin(isoAngle) - relX / Math.cos(isoAngle)) / 2;

      const snappedX = Math.round(isoX / gridSize) * gridSize;
      const snappedY = Math.round(isoY / gridSize) * gridSize;

      const finalX = (canvas.width / 2) + panX + (snappedX - snappedY) * Math.cos(isoAngle);
      const finalY = (canvas.height / 3) + panY + (snappedX + snappedY) * Math.sin(isoAngle);

      return { x: finalX, y: finalY };
    }

    // Eventos Táctiles
    canvas.addEventListener('pointerdown', (e) => {
      startX = e.clientX;
      startY = e.clientY;

      if (mode === 'move') {
        isDragging = true;
      } else if (mode === 'node') {
        saveState();
        const pt = getIsoGridPoint(e.clientX, e.clientY);
        const fit = document.getElementById('fitting-type').value;
        nodes.push({ id: Date.now(), x: pt.x - panX, y: pt.y - panY, level: currentLevel, fitting: fit });
        draw();
      } else if (mode === 'pipe') {
        const pt = { x: e.clientX - panX, y: e.clientY - panY };
        const clicked = nodes.find(n => Math.hypot(n.x - pt.x, n.y - pt.y) < 22 && n.level === currentLevel);

        if (clicked) {
          if (!selectedNode) {
            selectedNode = clicked;
          } else if (selectedNode.id !== clicked.id) {
            saveState();
            const sys = document.getElementById('sys-type').value;
            const dia = document.getElementById('pipe-dia').value;
            pipes.push({ id: Date.now(), from: selectedNode.id, to: clicked.id, system: sys, diameter: dia, level: currentLevel });
            selectedNode = null;
          }
          draw();
        }
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (isDragging && mode === 'move') {
        panX += e.clientX - startX;
        panY += e.clientY - startY;
        startX = e.clientX;
        startY = e.clientY;
        draw();
      }
    });

    canvas.addEventListener('pointerup', () => isDragging = false);

    // Renderizado en Pantalla
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Dibujar Plano de Fondo (Calcado)
      if (bgImage) {
        ctx.save();
        const opacity = parseFloat(document.getElementById('bg-opacity').value) || 0.5;
        ctx.globalAlpha = opacity;
        
        // Escalar manteniendo proporción
        const scale = Math.min(canvas.width / bgImage.width, canvas.height / bgImage.height) * 0.9;
        const imgW = bgImage.width * scale;
        const imgH = bgImage.height * scale;
        const imgX = (canvas.width - imgW) / 2 + panX;
        const imgY = (canvas.height - imgH) / 2 + panY;

        ctx.drawImage(bgImage, imgX, imgY, imgW, imgH);
        ctx.restore();
      }

      // 2. Dibujar Rejilla Isométrica
      const centerX = canvas.width / 2 + panX;
      const centerY = canvas.height / 3 + panY;

      for (let r = -12; r <= 12; r++) {
        for (let c = -12; c <= 12; c++) {
          const gx = centerX + (r - c) * gridSize * Math.cos(isoAngle);
          const gy = centerY + (r + c) * gridSize * Math.sin(isoAngle);
          ctx.beginPath();
          ctx.arc(gx, gy, 1.2, 0, Math.PI * 2);
          ctx.fillStyle = bgImage ? '#00b37e' : '#323238';
          ctx.fill();
        }
      }

      // 3. Dibujar Tuberías
      pipes.forEach(p => {
        const n1 = nodes.find(n => n.id === p.from);
        const n2 = nodes.find(n => n.id === p.to);
        if (n1 && n2) {
          ctx.beginPath();
          ctx.moveTo(n1.x + panX, n1.y + panY);
          ctx.lineTo(n2.x + panX, n2.y + panY);
          ctx.strokeStyle = sysColors[p.system] || '#00a8ff';
          ctx.lineWidth = Math.max(3, parseFloat(p.diameter) * 3);
          ctx.lineCap = 'round';
          if (p.level !== currentLevel) ctx.globalAlpha = 0.25;
          ctx.stroke();
          ctx.globalAlpha = 1.0;
        }
      });

      // 4. Dibujar Nodos y Accesorios
      nodes.forEach(n => {
        const isCurrent = n.level === currentLevel;
        const nx = n.x + panX;
        const ny = n.y + panY;

        ctx.beginPath();
        ctx.arc(nx, ny, 7, 0, Math.PI * 2);
        ctx.fillStyle = selectedNode && selectedNode.id === n.id ? '#fba94c' : (isCurrent ? '#00b37e' : '#555');
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        if (n.fitting && n.fitting !== 'none') {
          ctx.fillStyle = '#fff';
          ctx.font = '10px sans-serif';
          let label = '';
          if (n.fitting === 'valvula') label = '🚰';
          if (n.fitting === 'codo') label = '90°';
          if (n.fitting === 'tee') label = 'T';
          if (n.fitting === 'bomba') label = '⚙️';
          if (n.fitting === 'punto') label = '🚿';
          ctx.fillText(label, nx + 9, ny - 5);
        }
      });
    }

    // Cómputo Automático de Materiales
    function generateMaterials() {
      let pipeSummary = {};
      let fittingSummary = {};

      pipes.forEach(p => {
        const n1 = nodes.find(n => n.id === p.from);
        const n2 = nodes.find(n => n.id === p.to);
        if (n1 && n2) {
          const distPixels = Math.hypot(n2.x - n1.x, n2.y - n1.y);
          const meters = (distPixels / gridSize) * 0.5; // 1 cuadrícula = 0.5m
          const key = `Tubería ${p.system.toUpperCase()} (${p.diameter}")`;
          pipeSummary[key] = (pipeSummary[key] || 0) + meters;
        }
      });

      nodes.forEach(n => {
        if (n.fitting && n.fitting !== 'none') {
          fittingSummary[n.fitting] = (fittingSummary[n.fitting] || 0) + 1;
        }
      });

      let html = '<table><tr><th>Elemento</th><th>Cantidad / Metros</th></tr>';
      for (let item in pipeSummary) {
        html += `<tr><td>${item}</td><td>${pipeSummary[item].toFixed(2)} m</td></tr>`;
      }
      for (let fit in fittingSummary) {
        html += `<tr><td>Accesorio: ${fit.toUpperCase()}</td><td>${fittingSummary[fit]} pcs</td></tr>`;
      }
      html += '</table>';

      document.getElementById('materials-list').innerHTML = html;
      closeModal('menu-modal');
      openModal('materials-modal');
    }

    // Configuración de API Key de Google Gemini
    function configureApiKey() {
      const currentKey = localStorage.getItem('gemini_api_key') || '';
      const key = prompt('Ingresa tu API Key de Google Gemini:', currentKey);
      if (key !== null) {
        localStorage.setItem('gemini_api_key', key.trim());
        alert('¡API Key guardada correctamente!');
      }
    }

    // Análisis de Croquis / Plano con Inteligencia Artificial
    async function analyzeImageWithAI() {
      if (!bgBase64) {
        alert('Por favor, toca primero "🖼️ Cargar Plano" y selecciona una foto de tu dibujo o plano.');
        return;
      }

      let apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        apiKey = prompt('Para usar el análisis con IA, ingresa tu API Key gratuita de Gemini (o configúrala en el Menú):');
        if (!apiKey) return;
        localStorage.setItem('gemini_api_key', apiKey.trim());
      }

      openModal('ai-modal');
      document.getElementById('ai-loading').style.display = 'block';
      document.getElementById('ai-results').style.display = 'none';

      try {
        const rawBase64 = bgBase64.split(',')[1];
        const promptText = `
          Actúa como un Ingeniero Hidráulico y Plomero Especialista. Analiza minuciosamente esta foto/plano/boceto a mano.
          Entrega un reporte estructurado que incluya:
          1. **Puntos de Agua y Drenaje Identificados:** Lista detallada (Lavamanos, W.C., Duchas, Bombas, Tanques, etc.).
          2. **Cómputo Métrico Estimado:** Metros lineales aproximados de tubería requeridos por sistema (Agua Fría, Agua Caliente, Servidas/Drenaje) y sus diámetros recomendados (½", ¾", 2", 4").
          3. **Cantidad Estimada de Accesorios:** Codos 90°, Tees, Válvulas de corte y uniones.
          4. **Sugerencias y Recomendaciones Técnicas:** Pendientes para drenajes, presiones recomendadas, o correcciones al trazado del croquis.
        `;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                { inline_data: { mime_type: bgMimeType, data: rawBase64 } }
              ]
            }]
          })
        });

        const data = await response.json();
        document.getElementById('ai-loading').style.display = 'none';

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const resText = data.candidates[0].content.parts[0].text;
          document.getElementById('ai-results').innerText = resText;
          document.getElementById('ai-results').style.display = 'block';
        } else {
          document.getElementById('ai-results').innerText = 'No se pudo obtener respuesta de la IA. Revisa si tu API Key es correcta.';
          document.getElementById('ai-results').style.display = 'block';
        }
      } catch (err) {
        document.getElementById('ai-loading').style.display = 'none';
        document.getElementById('ai-results').innerText = 'Error al conectar con la IA: ' + err.message;
        document.getElementById('ai-results').style.display = 'block';
      }
    }

    function saveData() {
      localStorage.setItem('iso_pro_nodes', JSON.stringify(nodes));
      localStorage.setItem('iso_pro_pipes', JSON.stringify(pipes));
      alert('¡Proyecto guardado!');
      closeModal('menu-modal');
    }

    function loadData() {
      const sn = localStorage.getItem('iso_pro_nodes');
      const sp = localStorage.getItem('iso_pro_pipes');
      if (sn) nodes = JSON.parse(sn);
      if (sp) pipes = JSON.parse(sp);
    }

    function clearAll() {
      if (confirm('¿Deseas borrar todo el trazado actual?')) {
        nodes = []; pipes = []; history = []; selectedNode = null;
        clearBgImage();
        localStorage.removeItem('iso_pro_nodes');
        localStorage.removeItem('iso_pro_pipes');
        draw();
        closeModal('menu-modal');
      }
    }

    function exportImage() {
      const link = document.createElement('a');
      link.download = 'isograma_completo.png';
      link.href = canvas.toDataURL();
      link.click();
      closeModal('menu-modal');
    }

    // Inicio
    loadData();
    resizeCanvas();
  </script>
</body>
</html>
