<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Isogramas de Plomería</title>
  <style>
    * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; user-select: none; }
    body { background: #141419; color: #e1e1e6; font-family: system-ui, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    #toolbar { display: flex; gap: 8px; padding: 10px; background: #1e1e24; border-bottom: 1px solid #323238; overflow-x: auto; }
    button { background: #29292e; color: #fff; border: 1px solid #323238; padding: 8px 14px; border-radius: 6px; font-size: 14px; white-space: nowrap; }
    button.active { background: #00875f; border-color: #00b37e; font-weight: bold; }
    #canvas-container { flex: 1; position: relative; width: 100%; height: 100%; background: #09090a; }
    svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="btn-move" class="active" onclick="setMode('move')">✋ Mover</button>
    <button id="btn-node" onclick="setMode('node')">📍 Nodo</button>
    <button id="btn-pipe" onclick="setMode('pipe')">🔗 Tubo</button>
    <button id="btn-clear" onclick="clearCanvas()">🗑️ Limpiar</button>
  </div>
  <div id="canvas-container">
    <svg id="svg-canvas">
      <defs>
        <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
          <circle cx="15" cy="15" r="1.5" fill="#323238" />
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)" />
      <g id="lines-group"></g>
      <g id="nodes-group"></g>
    </svg>
  </div>
  <script>
    let mode = 'move';
    let nodes = [];
    let selectedNode = null;
    const svg = document.getElementById('svg-canvas');
    const nodesGroup = document.getElementById('nodes-group');
    const linesGroup = document.getElementById('lines-group');

    function setMode(newMode) {
      mode = newMode;
      document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + newMode).classList.add('active');
      selectedNode = null;
    }

    function clearCanvas() {
      nodes = [];
      nodesGroup.innerHTML = '';
      linesGroup.innerHTML = '';
      selectedNode = null;
    }

    svg.addEventListener('pointerdown', (e) => {
      const rect = svg.getBoundingClientRect();
      const x = Math.round((e.clientX - rect.left) / 30) * 30;
      const y = Math.round((e.clientY - rect.top) / 30) * 30;

      if (mode === 'node') {
        const node = { x, y, id: Date.now() };
        nodes.push(node);
        renderNodes();
      } else if (mode === 'pipe') {
        const clicked = nodes.find(n => Math.hypot(n.x - x, n.y - y) < 25);
        if (clicked) {
          if (!selectedNode) {
            selectedNode = clicked;
            renderNodes();
          } else if (selectedNode.id !== clicked.id) {
            drawPipe(selectedNode, clicked);
            selectedNode = null;
            renderNodes();
          }
        }
      }
    });

    function renderNodes() {
      nodesGroup.innerHTML = '';
      nodes.forEach(n => {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', n.x);
        circle.setAttribute('cy', n.y);
        circle.setAttribute('r', '8');
        circle.setAttribute('fill', selectedNode && selectedNode.id === n.id ? '#00b37e' : '#fba94c');
        nodesGroup.appendChild(circle);
      });
    }

    function drawPipe(n1, n2) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', n1.x);
      line.setAttribute('y1', n1.y);
      line.setAttribute('x2', n2.x);
      line.setAttribute('y2', n2.y);
      line.setAttribute('stroke', '#00b37e');
      line.setAttribute('stroke-width', '4');
      linesGroup.appendChild(line);
    }
  </script>
</body>
</html>
